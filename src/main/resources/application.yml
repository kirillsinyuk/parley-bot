spring:
  application:
    name: parley-bot
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:sqlite:/data/db.sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
      audio:
        speech:
          options:
            model: gpt-4o-mini-tts
            voice: alloy
            response-format: mp3
        transcription:
          options:
            model: gpt-4o-mini-transcribe
management:
  endpoints:
    web:
      exposure:
        include: loggers,health,info,metrics

bot:
  token: ${BOT_TOKEN}

admin:
  chat-id: ${ADMIN_CHAT_ID}
